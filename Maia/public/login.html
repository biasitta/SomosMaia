<!DOCTYPE html>
<html lang="pt-BR"> <!-- Define que o documento é HTML5 e está em português do Brasil -->

<head>
    <meta charset="UTF-8"> <!-- Garante suporte a acentos e caracteres especiais -->
    <title>Login - Rede de Apoio Materno</title> <!-- Título da aba do navegador -->

    <style>
        /* Reset básico para incluir padding/borda no cálculo do tamanho */
        * {
            box-sizing: border-box;
        }

        /* Estilo geral do corpo da página */
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            /* Fonte padrão */
            background: linear-gradient(to right, #f5ebe0, #e6ccb2);
            /* Fundo em degradê */
            display: flex;
            /* Flexbox para centralizar */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Ocupa altura total da tela */
            color: #4a3c31;
            /* Cor padrão do texto */
        }

        /* Container principal que envolve os dois painéis */
        .container {
            display: flex;
            flex-wrap: wrap;
            /* Permite quebra em telas menores */
            width: 90%;
            max-width: 1000px;
            background-color: #fffaf6;
            /* Fundo claro */
            border-radius: 12px;
            /* Bordas arredondadas */
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
            /* Sombra */
            overflow: hidden;
            /* Evita conteúdo ultrapassar borda */
        }

        /* Painel esquerdo com mensagem de boas-vindas */
        .left-panel {
            flex: 1;
            /* Ocupa metade do espaço */
            min-width: 300px;
            background-color: #7f5539;
            /* Fundo marrom */
            color: #fff;
            /* Texto branco */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            /* Alinha à esquerda */
            padding: 50px;
        }

        .left-panel h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .left-panel p {
            font-size: 15px;
            max-width: 350px;
            line-height: 1.5;
            /* Espaçamento entre linhas */
        }

        /* Painel direito com formulário de login */
        .right-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        /* Caixa que contém o formulário */
        .login-box {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-box h2 {
            color: #7f5539;
            margin-bottom: 20px;
        }

        /* Estilo dos campos de entrada */
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d9c5b2;
            border-radius: 5px;
            font-size: 14px;
            background-color: #f5ebe0;
            color: #4a3c31;
        }

        /* Placeholder dos inputs */
        .login-box input::placeholder {
            color: #7f5539;
        }

        /* Botão de envio */
        .login-box input[type="submit"] {
            background-color: #7f5539;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            /* Efeito suave */
        }

        /* Efeito hover no botão */
        .login-box input[type="submit"]:hover {
            background-color: #9c6644;
        }

        /* Área de opções (checkbox + link) */
        .options {
            display: flex;
            justify-content: space-between;
            /* Um à esquerda, outro à direita */
            font-size: 13px;
            margin: 10px 0;
            align-items: center;
        }

        /* Estilo do checkbox e texto */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            /* Espaço entre checkbox e texto */
            cursor: pointer;
            white-space: nowrap;
            /* Impede quebra de linha */
        }

        /* Links */
        .options a {
            color: #7f5539;
            text-decoration: none;
        }

        .options a:hover {
            color: #9c6644;
        }

        /* Área social */
        .social {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #7f5539;
        }

        .social a {
            color: #7f5539;
            text-decoration: none;
            margin: 0 8px;
        }

        .social a:hover {
            color: #9c6644;
        }

        /* Rodapé */
        footer {
            text-align: center;
            font-size: 12px;
            color: #7f5539;
            margin-top: 30px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                /* Empilha os painéis */
            }

            .left-panel,
            .right-panel {
                align-items: center;
                text-align: center;
            }

            .left-panel {
                padding: 30px;
            }

            .right-panel {
                padding: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Container principal -->
    <div class="container">

        <!-- Painel esquerdo com mensagem -->
        <div class="left-panel">
            <h1>Bem-vinda, mamãe!</h1>
            <p>Estamos aqui para apoiar você no pós-parto, oferecendo ajuda emocional, física e psicológica.</p>
        </div>

        <!-- Painel direito com formulário -->
        <div class="right-panel">
            <div class="login-box">
                <h2>Login</h2>

                <!-- Formulário de login -->
                <form method="POST" action="http://localhost:3000/cliente/login">
                    <input type="email" name="Email" placeholder="Endereço de e-mail" required>
                    <input type="password" name="Senha" placeholder="Senha" required>

                    <!-- Opções extras -->
                    <div class="options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="lembrar"> Lembrar-me
                        </label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <!-- Botão de envio -->
                    <input type="submit" value="Entrar">
                </form>

                <!-- Link para cadastro -->
                <p style="margin-top:15px;">Não possui conta? <a href="/cadastro">Cadastre-se</a></p>

                <!-- Redes sociais -->
                <div class="social">
                    <span>Siga:</span>
                    <a href="https://www.instagram.com/mmaiabrasil/" target="_blank">Instagram</a>
                </div>


                <!-- Rodapé -->
                <footer>
                    © 2026 Maia - Todos os direitos reservados
                </footer>
            </div>
        </div>
    </div>

    <!-- Adicione este script antes de fechar o  -->
<script>
    // Quando a página carregar, verifica se há email salvo
    window.onload = function () {
        const savedEmail = localStorage.getItem("email");
        const savedCheck = localStorage.getItem("lembrar");

        if (savedEmail && savedCheck === "true") {
            document.querySelector('input[name="Email"]').value = savedEmail;
            document.getElementById("lembrar").checked = true;
        }
    };

    // Captura o envio do formulário
    document.querySelector("form").addEventListener("submit", function () {
        const email = document.querySelector('input[name="Email"]').value;
        const lembrar = document.getElementById("lembrar").checked;

        if (lembrar) {
            // Salva no localStorage
            localStorage.setItem("email", email);
            localStorage.setItem("lembrar", "true");
        } else {
            // Remove se não estiver marcado
            localStorage.removeItem("email");
            localStorage.removeItem("lembrar");
        }
    });
</script>

</body>

</html>
