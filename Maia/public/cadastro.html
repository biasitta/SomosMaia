<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Rede de Apoio Materno</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to right, #f5ebe0, #e6ccb2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a3c31;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background-color: #fffaf6;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #7f5539;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d9c5b2;
            border-radius: 5px;
            background-color: #f5ebe0;
            color: #4a3c31;
        }

        /* Campo de senha com ícone */
        .senha-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .senha-container input {
            flex: 1;
            padding-right: 40px; /* espaço para o ícone */
        }

        .senha-container span {
            position: absolute;
            right: 10px;
            cursor: pointer;
            font-size: 18px;
            color: #7f5539;
        }

        input[type="submit"] {
            background-color: #7f5539;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #9c6644;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
        }

        .checkbox-label a {
            color: #7f5539;
            text-decoration: none;
        }

        .checkbox-label a:hover {
            color: #9c6644;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #7f5539;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro</h2>
        <form method="POST" action="http://localhost:3000/cliente/cadastro">
            <!-- Nome -->
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="Nome" required>

            <!-- Email -->
            <label for="email">E-mail</label>
            <input type="email" id="email" name="Email" required>

            <!-- Senha com olho -->
            <label for="senha">Senha</label>
            <div class="senha-container">
                <input type="password" id="senha" name="Senha" required>
                <span onclick="toggleSenha()" id="toggleIcon">👁️</span>
            </div>

            <!-- Data de nascimento -->
            <label for="data">Data de nascimento</label>
            <input type="date" id="data" name="DataNascimento" required>

            <!-- Fase -->
            <label for="fase">Fase</label>
            <select id="fase" name="Fase" required>
                <option value="">Selecione...</option>
                <option value="gestante">Gestante</option>
                <option value="puerpera">Puérpera</option>
            </select>

            <!-- Semanas de gestação -->
            <label for="semanas">Semanas de gestação</label>
            <input type="number" id="semanas" name="SemanasGestacao" min="0" max="42">

            <!-- Telefone -->
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="Telefone" placeholder="(XX) XXXXX-XXXX" required>

            <!-- Checkbox termos -->
            <label class="checkbox-label">
                <input type="checkbox" id="termos" required>
                Aceito os <a href="https://www.seusite.com/termos" target="_blank">termos de uso</a>
            </label>

            <!-- Botão -->
            <input type="submit" value="Cadastrar">
        </form>

        <p style="text-align:center; margin-top:15px;">Já tem conta? <a href="/login" style="color:#7f5539; font-weight:bold;">Entrar</a></p>

        <footer>
            © 2026 Rede de Apoio Materno - Todos os direitos reservados
        </footer>
    </div>

    <script>
        function toggleSenha() {
            const campoSenha = document.getElementById("senha");
            const icon = document.getElementById("toggleIcon");
            if (campoSenha.type === "password") {
                campoSenha.type = "text"; // mostra a senha
                icon.textContent = "🙈"; // muda ícone para "ocultar"
            } else {
                campoSenha.type = "password"; // oculta a senha
                icon.textContent = "👁️"; // volta ícone para "mostrar"
            }
        }
    </script>
</body>
</html>
